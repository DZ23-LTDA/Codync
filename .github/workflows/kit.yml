name: iOS Kit

# The iPhone app's Swift package (apps/ios/Kit): models, client, stores and screens.
on:
  pull_request:
    paths: ["apps/ios/Kit/**", "docs/reference/fixtures/remote-relay-vectors.json", ".github/workflows/kit.yml"]

# A newer push to the same PR supersedes the run in progress; tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios/Kit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Test on an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          # A test that fails is run again, up to twice: a timing hiccup on a busy runner no longer fails
          # the whole run (the result bundle still records the retries).
          xcodebuild test -scheme CodyncKit-Package -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath "$RUNNER_TEMP/CodyncKit.xcresult" -retry-tests-on-failure -test-iterations 3 -quiet
      - name: Report test failures
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/CodyncKit.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/CodyncKit.xcresult"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ios-kit-test-results
          path: ${{ runner.temp }}/CodyncKit.xcresult
          retention-days: 7
